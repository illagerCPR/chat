name: Deploy to Cloudflare

# 需要两个仓库 Secret：
#   CLOUDFLARE_API_TOKEN  —— API Token，模板选 "Edit Cloudflare Workers"，再补 R2 的 Edit 权限
#   CLOUDFLARE_ACCOUNT_ID —— Cloudflare 账号 ID
# 没配 Token 时整个部署步骤跳过，流水线不会红。
#
# D1 与 R2 资源需要先创建一次（见 README 的 Cloudflare 章节），
# database_id 已经写在 wrangler.jsonc 里，schema 变更随 migrations/ 一起部署。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.6.0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm type

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          # 仓库变量 API_ORIGIN 可改指向自建网关；未设置时用 DeepSeek 官方地址
          API_ORIGIN: ${{ vars.API_ORIGIN || 'https://api.deepseek.com' }}

      # 没有配置 Token 时优雅跳过：本地/首次 clone 的仓库不会因为缺 Secret 变成红色
      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping the Cloudflare deploy."
          fi

      # 先搬 schema 再发代码：迁移都是向后兼容的增量
      - name: Apply D1 migrations
        if: steps.creds.outputs.enabled == 'true'
        run: pnpm exec wrangler d1 migrations apply aris-chat --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        if: steps.creds.outputs.enabled == 'true'
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
